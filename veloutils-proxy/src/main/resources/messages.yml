maintenance:
  denied: "<red>The network is under maintenance.</red> <gray><reason>"
  enabled: "<green>Maintenance enabled: <reason>"
  disabled: "<yellow>Maintenance disabled."
server-access:
  denied: "<red>You cannot access that server."
report:
  created: "<green>Report <id> was submitted."
  staff-notification: "<yellow>New <type> <id> from <reporter>: <reason>"
moderation:
  banned: "<red>You are banned from this network.</red>\n<gray>Reason: <reason>"
staff-chat:
  sent: "<dark_gray>[<aqua><channel></aqua>] <player>: <message>"

