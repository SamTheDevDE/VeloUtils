config-version: 1

ui:
  page-size: 5

modules:
  maintenance: true
  reports: true
  staff: true
  staff-chat: true
  chat: false
  messaging: false
  moderation: false
  motd: true
  server-access: true
  network-commands: true
  discord: false
  alerts: true

chat:
  player-formatting:
    # Player-entered MiniMessage is limited to the safe presentation tags below.
    enabled: true
    default:
      colors: false
      decorations: false
      gradients: false
    permissions:
      colors: veloutils.chat.format.colors
      decorations: veloutils.chat.format.decorations
      gradients: veloutils.chat.format.gradients
      # "full" means all safe presentation formats, never click/hover/data-driven tags.
      full: veloutils.chat.format.full

protocol:
  maximum-payload-bytes: 32768
  request-timeout: 5s
  authentication:
    # Authentication is deliberately marked disabled until a shared secret is configured.
    # Production networks should set required: true after configuring every bridge.
    required: false
    # Generate a unique 32+ byte secret and set the exact same value on every bridge.
    shared-secret: ""
  remote-commands:
    enabled: false
    allowlist:
      - "say"
      - "list"

compatibility:
  legacy-permissions:
    enabled: true
    warn: true

update-checker:
  enabled: true
  provider: modrinth
  project-id: veloutils
  check-interval: 6h

maintenance:
  pre-activation-transfer:
    enabled: false
    before: 30s
    destinations:
      - lobby
      - limbo

server-access:
  servers:
    builder:
      permission: veloutils.server.builder
      fallback:
        - lobby
        - limbo

# Optional metadata exposed as data/display placeholders. Keys must match the
# registered Velocity server names. A max-players value of 0 means unknown.
servers: {}

motd:
  entries:
    - "<gradient:#7c3aed:#a855f7><bold>VeloUtils Network</bold></gradient>\n<gray>{players} players online</gray>"
    - "<aqua>Welcome to the network</aqua>\n<gray>Securely connected by VeloUtils</gray>"
  maintenance-entries:
    - "<red><bold>Network maintenance</bold></red>\n<gray>{reason}</gray>"
  maximum-players: 1000
  sample-players:
    - "<gradient:#7c3aed:#a855f7><bold>✦ VeloUtils Network ✦</bold></gradient>"
    - "<gray>Players Online: <white>{players}</white>/<white>{max_players}</white></gray>"
  favicon: ""
