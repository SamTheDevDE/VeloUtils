config-version: 1
debug: false

modules:
  maintenance: true
  reports: true
  staff: true
  staff-chat: true
  moderation: false
  motd: true
  server-access: true
  network-commands: true
  discord: false
  alerts: true
  tebex: false

protocol:
  maximum-payload-bytes: 32768
  request-timeout: 5s
  authentication:
    # Authentication is deliberately marked disabled until a shared secret is configured.
    # Production networks should set required: true after configuring every bridge.
    required: false
    # Generate a unique 32+ byte secret and set the exact same value on every bridge.
    shared-secret: ""
  remote-commands:
    enabled: false
    allowlist:
      - "say"
      - "list"

staff:
  week-start: MONDAY

compatibility:
  legacy-permission-aliases: false

update-checker:
  enabled: true
  provider: modrinth
  project-id: veloutils
  check-interval: 6h

server-access:
  servers:
    builder:
      permission: veloutils.server.builder
      allowlist: []
      fallback: [lobby, limbo]

motd:
  entries:
    - "<gradient:#7c3aed:#a855f7><bold>VeloUtils Network</bold></gradient>\n<gray>{players} players online"
    - "<aqua>Welcome to the network</aqua>\n<gray>Securely connected by VeloUtils"
  maintenance-entries:
    - "<red><bold>Network maintenance</bold></red>\n<gray>{reason}"
  maximum-players: 1000
  sample-players: ["VeloUtils on Velocity 4.1"]
  favicon: ""
  virtual-hosts: {}
