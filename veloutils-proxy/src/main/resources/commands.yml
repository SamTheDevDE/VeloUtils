config-version: 1
move-commands:
  lobby:
    aliases:
      - hub
    servers:
      - lobby
      - limbo
    permission: veloutils.command.lobby
    cooldown: 3s
  survival:
    servers:
      - survival
    permission: veloutils.command.survival
    cooldown: 3s

message-commands:
  discord:
    aliases:
      - dc
    permission: veloutils.message.discord
    cooldown: 5s
    messages:
      - "<gray>Discord: </gray><click:open_url:'https://example.com'><aqua>Click here</aqua></click>"
