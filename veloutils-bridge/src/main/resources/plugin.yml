name: VeloUtilsBridge
version: '${version}'
main: de.samthedev.veloutils.bridge.bootstrap.VeloUtilsBridgePlugin
description: Lightweight Paper and Folia bridge for VeloUtils
api-version: '26.2'
author: SamTheDevDE
folia-supported: true
softdepend:
  - PlaceholderAPI
commands:
  vualert:
    description: Sends an authorized network alert through VeloUtils
    usage: /vualert <message>
  sc:
    description: Sends a staff-channel message
    usage: /sc <message>
  ac:
    description: Sends an admin-channel message
    usage: /ac <message>
permissions:
  veloutils.alert.broadcast:
    default: op
  veloutils.chat.staff.use:
    default: op
  veloutils.chat.admin.use:
    default: op
