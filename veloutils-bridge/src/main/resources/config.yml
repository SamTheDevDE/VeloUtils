config-version: 1
heartbeat: 10s
compatibility:
  legacy-permissions:
    enabled: true
    warn: true
protocol:
  maximum-payload-bytes: 32768
  authentication:
    # Must match the proxy. Enable on both ends for production networks.
    required: false
    shared-secret: ""
  remote-commands:
    enabled: false
    allowlist:
      - "say"
      - "list"
moderation:
  mute-message: "<red>You are muted.</red> <gray>Reason: <reason></gray>"
