name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate tag and build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          ./gradlew --no-daemon --configuration-cache clean qualityGate -PprojectVersion="$VERSION"
          mkdir -p release
          cp veloutils-api/build/libs/veloutils-api-"$VERSION".jar release/
          cp veloutils-proxy/build/libs/veloutils-proxy-"$VERSION".jar release/
          cp veloutils-bridge/build/libs/veloutils-bridge-"$VERSION".jar release/
          cd release
          sha256sum *.jar > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.jar
            release/SHA256SUMS
