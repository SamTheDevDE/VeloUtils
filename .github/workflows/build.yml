name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify
        run: ./gradlew --no-daemon --configuration-cache clean qualityGate
      - uses: actions/upload-artifact@v4
        with:
          name: veloutils-${{ github.sha }}
          if-no-files-found: error
          path: |
            veloutils-api/build/libs/veloutils-api-*.jar
            veloutils-proxy/build/libs/veloutils-proxy-*.jar
            veloutils-bridge/build/libs/veloutils-bridge-*.jar
